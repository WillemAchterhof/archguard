# ==============================================================================
# ArchGuard — Kernel Module Blacklist
# ==============================================================================
#
# PERSONAL CONFIGURATION
#
# This blacklist is specifically tailored to the author's hardware and usage.
# It is NOT a universal Arch Linux security blacklist.
#
# If using ArchGuard on different hardware, review and create your own
# blacklist based on the hardware and functionality actually required.
#
# USB device authorization is handled separately by USBGuard.
#
# ==============================================================================


# ------------------------------------------------------------------------------
# Thunderbolt
# ------------------------------------------------------------------------------
# No Thunderbolt hardware required.
blacklist thunderbolt


# ------------------------------------------------------------------------------
# FireWire / IEEE 1394
# ------------------------------------------------------------------------------
# No FireWire hardware required.
blacklist firewire_core
blacklist firewire_ohci
blacklist firewire_sbp2


# ------------------------------------------------------------------------------
# Floppy
# ------------------------------------------------------------------------------
# No floppy hardware required.
blacklist floppy


# ------------------------------------------------------------------------------
# PC Speaker
# ------------------------------------------------------------------------------
# No internal PC speaker required.
blacklist pcspkr


# ------------------------------------------------------------------------------
# Parallel Port
# ------------------------------------------------------------------------------
# No parallel-port hardware required.
blacklist parport
blacklist parport_pc
blacklist ppdev


# ------------------------------------------------------------------------------
# Legacy PS/2 Mouse
# ------------------------------------------------------------------------------
# Tested on the target system.
# The system's touchpad/input functionality does not depend on psmouse.
blacklist psmouse


# ------------------------------------------------------------------------------
# Legacy 8250/16550 Serial
# ------------------------------------------------------------------------------
# No legacy serial hardware required.
# Tested on the target physical system and KVM configuration.
blacklist serial8250
blacklist 8250_pnp


# ------------------------------------------------------------------------------
# Optical Drives
# ------------------------------------------------------------------------------
# No physical or virtual optical drives required.
# VM installation media is provided through USB passthrough.
blacklist sr_mod
blacklist cdrom


# ------------------------------------------------------------------------------
# Legacy ATA Controllers
# ------------------------------------------------------------------------------
# These controllers are not present/required on the target system.
blacklist pata_acpi
blacklist pata_atiixp
blacklist pata_jmicron


# ------------------------------------------------------------------------------
# Legacy SCSI Controllers
# ------------------------------------------------------------------------------
# These controllers are not present/required on the target system.
blacklist megaraid
blacklist mptbase
blacklist mptscsih
blacklist aic7xxx
blacklist aic79xx


# ------------------------------------------------------------------------------
# Game Controllers
# ------------------------------------------------------------------------------
# No game controllers required.
blacklist joydev