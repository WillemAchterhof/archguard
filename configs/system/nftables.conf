#!/usr/sbin/nft -f

# Declare (or reuse, if already present) only ArchGuard's own tables,
# then flush just those — this must never touch tables other services
# (libvirt, NetworkManager, firewalld, etc.) create for themselves.

table inet archguard_filter
table ip archguard_nat

flush table inet archguard_filter
flush table ip archguard_nat

# ==============================================================================
# ArchGuard — Host Firewall
#
# Security model:
#
#   Internet ───────> Host       DENY by default
#   VM ─────────────> Host       DENY by default
#   Host ───────────> VM         ALLOW (host initiated)
#   VM ─────────────> Internet   ALLOW
#   Internet ───────> VM         DENY
#   VM ─────────────> VM         DENY by ArchGuard
#
# Libvirt owns its own virtual-network rules.
# ArchGuard owns host security policy.
#
# Guests do not use libvirt's built-in dnsmasq for DHCP/DNS — they're
# configured with static IPs in the virbr0 subnet, virbr0's host IP as
# gateway, and a public DNS resolver. That's what makes "VM -> Host:
# DENY by default" actually true with no built-in exceptions, at the
# cost of guests needing static network config instead of DHCP.
# ==============================================================================

define WAN_IFACE = "__AG_WAN_IFACE__"
define VM_IFACE  = "virbr0"

table inet archguard_filter {

    # --------------------------------------------------------------------------
    # INPUT — traffic destined for the ArchGuard host
    # --------------------------------------------------------------------------

    chain input {
        type filter hook input priority filter;
        policy drop;

        # Invalid packets
        ct state invalid drop

        # Existing/related connections
        ct state { established, related } accept

        # Loopback
        iifname "lo" accept

        # ----------------------------------------------------------------------
        # IPv4 anti-spoofing
        #
        # These addresses should never arrive from an external interface.
        # ----------------------------------------------------------------------

        ip saddr {
            0.0.0.0/8,
            100.64.0.0/10,
            169.254.0.0/16,
            192.0.2.0/24,
            198.18.0.0/15,
            224.0.0.0/4,
            240.0.0.0/4
        } iifname != { "lo", $VM_IFACE } drop

        # ----------------------------------------------------------------------
        # Invalid TCP flag combinations
        # ----------------------------------------------------------------------

        tcp flags & (fin|syn|rst|psh|ack|urg) == 0 drop
        tcp flags & (fin|syn) == (fin|syn) drop

        # ----------------------------------------------------------------------
        # ICMP / ICMPv6
        #
        # Required for normal IP operation and diagnostics.
        # Rate limited to prevent abuse.
        # ----------------------------------------------------------------------

        ip protocol icmp limit rate 10/second accept
        meta l4proto ipv6-icmp limit rate 10/second accept

        # ----------------------------------------------------------------------
        # Host's own DHCP client traffic (WAN)
        #
        # This host's own lease renewal — client ports only.
        # DHCP handshakes don't reliably match conntrack's
        # established/related state (initial packets use src 0.0.0.0
        # and broadcast dest), so this stays as an explicit rule.
        # Remove if the host uses a static WAN address instead of DHCP.
        # ----------------------------------------------------------------------

        udp dport 68 accept
        udp dport 546 accept

        # ----------------------------------------------------------------------
        # mDNS
        #
        # NOT enabled in the baseline.
        #
        # Add an explicit rule later if ArchGuard itself requires mDNS.
        # ----------------------------------------------------------------------

        # No VM -> Host exceptions: guests use static IPs + external
        # DNS, so there's no DHCP/DNS service on virbr0 to allow.
    }


    # --------------------------------------------------------------------------
    # FORWARD — traffic passing through ArchGuard
    # --------------------------------------------------------------------------

    chain forward {
        type filter hook forward priority filter;
        policy drop;

        # Invalid packets
        ct state invalid drop

        # Return traffic
        ct state { established, related } accept

        # ----------------------------------------------------------------------
        # VM -> WAN
        #
        # Guests may initiate outbound connections.
        # ----------------------------------------------------------------------

        iifname $VM_IFACE oifname $WAN_IFACE accept

        # ----------------------------------------------------------------------
        # Everything else is denied.
        #
        # Therefore:
        #
        # WAN -> VM       DENY
        # VM -> VM        DENY
        # WAN -> other    DENY
        # ----------------------------------------------------------------------
    }


    # --------------------------------------------------------------------------
    # OUTPUT — traffic generated by ArchGuard itself
    # --------------------------------------------------------------------------

    chain output {
        type filter hook output priority filter;
        policy accept;
    }
}


# ==============================================================================
# IPv4 NAT
# ==============================================================================

table ip archguard_nat {

    chain postrouting {
        type nat hook postrouting priority srcnat;

        # Libvirt guest network -> WAN
        #
        # Masquerading is stateful and uses conntrack.
        # Restrict it to the libvirt subnet rather than masquerading
        # arbitrary forwarded traffic.
        #
        oifname $WAN_IFACE \
            ip saddr 192.168.122.0/24 \
            masquerade
    }
}